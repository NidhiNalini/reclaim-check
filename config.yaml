# ReclaimCheck configuration
# Every setting the pipeline uses lives here, so results can be reproduced
# and every analysis choice is documented in one place.

paths:
  # Put the real files in data/raw/. If they are missing, the sample files
  # in data/sample/ are used instead (run: python -m reclaimcheck sample).
  owa_inventory: data/raw/owa_inventory.xlsx      # OWA Site-specific Inventory (Excel)
  aer_wells: data/raw/st37_wells.csv              # AER ST37 List of Wells (CSV or Excel)
  county_boundaries: data/reference/municipal_boundaries.geojson   # optional
  ats_lsd_centroids: data/reference/ats_lsd_centroids.csv          # optional
  sample_dir: data/sample
  cache_dir: data/cache
  outputs: outputs

# Date the analysis is "as of". Freeze it so ages do not change between runs.
reference_date: "2026-10-13"

# The 8 columns in the OWA inventory, mapped to the names used in the code.
owa_columns:
  site_name: "Site Name"
  licensee: "Licensee"
  department: "Responsible Department"
  project_type: "Current Project Type"
  component_type: "Component Type"
  licence: "License Number"
  from_location: "From Location"
  to_location: "To Location"

# Which rows count as wells (Component Type contains any of these words).
well_component_keywords: ["well"]

# Map Current Project Type / Responsible Department text to a cleanup stage.
# Matching is by keyword, first match wins. Update after checking the real values.
stage_keywords:
  - [decommission, Decommissioning]
  - [abandon, Decommissioning]
  - [assess, Assessment]
  - [remediat, Remediation]
  - [monitor, Reclamation]
  - [certif, Reclamation]
  - [reclam, Reclamation]
  - [closed, Closed]
# Within Reclamation, text that means "vegetation should already be back".
expect_recovered_keywords: [monitor, certif, application]
# Stages that the satellite component checks.
satellite_stages: [Reclamation]

# Study area. The data component profiles all of Alberta for context,
# then focuses on these counties.
study_counties: ["Red Deer County", "Lacombe County", "Ponoka County"]

# AER ST37 column detection (regular expressions, case-insensitive).
aer_columns:
  licence: "licen[cs]e.*(no|num)|^licen[cs]e$"
  licensee: "licensee(?!.*code)"
  status: "status"
  licence_date: "licen[cs]e.*date|issue.*date"
  spud_date: "spud|drill.*date"
  uwi: "uwi|well.*identifier"

satellite:
  provider: synthetic          # synthetic (offline demo) or stac (real Sentinel-2)
  stac_url: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  season: ["07-01", "08-31"]   # mid-summer only
  max_scene_cloud: 30          # % cloud for the whole scene search
  max_window_cloud: 0.30       # skip a year if >30% of the site window is cloudy
  window_m: 400                # side of the square around each site, metres
  pixel_m: 10
  # Scene Classification (SCL) classes treated as unusable:
  # 0 no data, 1 defective, 3 cloud shadow, 8-9 cloud, 10 cirrus, 11 snow
  scl_bad: [0, 1, 3, 8, 9, 10, 11]
  bare_ndvi: 0.30              # pixel is bare ground if NDVI is below this
  pad_min_px: 25               # smallest plausible pad, pixels (0.25 ha)
  pad_max_px: 400              # largest plausible pad, pixels (4 ha)
  ring_inner_px: 2             # comparison ring starts this far outside the pad
  ring_outer_px: 10
  recovered_ratio: 0.80        # pad NDVI >= 80% of field NDVI
  recovered_bare_pct: 20       # and under 20% of pad pixels bare
  partial_ratio: 0.55
  timeline_rise: 0.15          # ratio rise that marks the start of recovery

priority:
  weights: {satellite: 50, mismatch: 30, age: 20}
  age_cap_years: 40            # wells this old or older get the full age score
  visit_first: 60
  visit: 35
  # Weight sets for the sensitivity check
  sensitivity:
    - {satellite: 50, mismatch: 30, age: 20}
    - {satellite: 70, mismatch: 20, age: 10}
    - {satellite: 34, mismatch: 33, age: 33}
    - {satellite: 40, mismatch: 50, age: 10}
    - {satellite: 30, mismatch: 20, age: 50}

visit_plan:
  office: {name: "Red Deer office", lat: 52.2681, lon: -113.8112}
  sites_per_day: 5
  road_factor: 1.3             # straight-line distance x 1.3 for rural roads
  speed_kmh: 70
  minutes_on_site: 45
